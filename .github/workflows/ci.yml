name: Windows CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: ${{ matrix.job }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        job: [windows-tests, opencode-discovery]
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false
          path: source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.job }}
      - name: Verify native package and mandatory tests
        env:
          CI_JOB: ${{ matrix.job }}
          CI_SOURCE: source-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.job }}
          CI_RUN: mail-lens-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.job }}
        run: |
          & powershell.exe -NoProfile -STA -File (Join-Path $env:GITHUB_WORKSPACE "$env:CI_SOURCE/scripts/run-ci.ps1") -Job $env:CI_JOB -RunRoot (Join-Path $env:RUNNER_TEMP $env:CI_RUN)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
